[package]
name = "crabbox-agent37"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "agent37 VM provider for crabbox (external provider protocol)"
repository = "https://github.com/IniZio/crabbox-agent37"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "crabbox-agent37"
path = "src/main.rs"

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", default-features = false, features = [
  "formatting",
  "macros",
  "std",
] }
tungstenite = "0.25"
ureq = { version = "3", features = ["json"] }
webpki-roots = "1"
zeroize = "1"
signal-hook = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
string_slice = "deny"
missing_errors_doc = "allow"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
redundant_pub_crate = "allow"
