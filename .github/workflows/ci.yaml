name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-target-${{ runner.os }}-

      - id: tools
        run: echo "list=$(make -s print-tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: ${{ steps.tools.outputs.list }}

      - run: make setup
      - run: make format-check
      - run: make lint
      - run: make audit
      - run: make unit
